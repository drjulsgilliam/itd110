<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 1920 940" width="1920" height="940" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- HERO IMAGE: "CSS turns code into design"
       Left: a code editor with CSS. Right: the styled website it creates.
       Center is kept calm so the headline stays readable. -->
  <defs>
    <radialGradient id="glowBlue" cx="300" cy="260" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="1650" cy="860" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="1500" cy="120" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="260" cy="980" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="siteHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#63e6e2"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2997ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="floorMask">
      <rect x="0" y="640" width="1920" height="440" fill="url(#floorFade)"/>
    </mask>
  </defs>

  <!-- Background + color glows -->
  <rect width="1920" height="1080" fill="#000"/>
  <rect width="1920" height="1080" fill="url(#glowBlue)"/>
  <rect width="1920" height="1080" fill="url(#glowPurple)"/>
  <rect width="1920" height="1080" fill="url(#glowTeal)"/>
  <rect width="1920" height="1080" fill="url(#glowPink)"/>

  <!-- Perspective grid floor -->
  <g stroke="#fff" stroke-width="1.5" mask="url(#floorMask)" fill="none">
    <path d="M960 640 L-640 1080 M960 640 L-240 1080 M960 640 L160 1080 M960 640 L560 1080
             M960 640 L960 1080 M960 640 L1360 1080 M960 640 L1760 1080 M960 640 L2160 1080 M960 640 L2560 1080"/>
    <path d="M0 680 H1920 M0 730 H1920 M0 795 H1920 M0 880 H1920 M0 990 H1920"/>
  </g>

  <!-- Light beam: code flowing into design -->
  <path d="M540 640 C 800 720, 1120 720, 1390 630" fill="none" stroke="url(#beam)" stroke-width="5" filter="url(#soft)"/>
  <path d="M540 640 C 800 720, 1120 720, 1390 630" fill="none" stroke="url(#beam)" stroke-width="2"/>

  <!-- ============ LEFT: CODE EDITOR ============ -->
  <g transform="translate(0 70) scale(0.85)">
  <g transform="rotate(-5 360 470)">
    <g filter="url(#shadow)">
      <rect x="70" y="250" width="580" height="440" rx="22" fill="#1d1d1f" fill-opacity="0.92"/>
    </g>
    <rect x="70" y="250" width="580" height="440" rx="22" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="102" cy="282" r="7" fill="#ff5f57"/>
    <circle cx="126" cy="282" r="7" fill="#febc2e"/>
    <circle cx="150" cy="282" r="7" fill="#28c840"/>
    <text x="360" y="288" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#86868b">style.css</text>
    <line x1="70" y1="310" x2="650" y2="310" stroke="#fff" stroke-opacity="0.08"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
      <text x="100" y="355" fill="#6e6e73">1</text>
      <text x="140" y="355"><tspan fill="#ff7ab2">.hero</tspan><tspan fill="#f5f5f7"> {</tspan></text>
      <text x="100" y="390" fill="#6e6e73">2</text>
      <text x="170" y="390"><tspan fill="#64d2ff">display</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#ff9f0a">grid</tspan><tspan fill="#f5f5f7">;</tspan></text>
      <text x="100" y="425" fill="#6e6e73">3</text>
      <text x="170" y="425"><tspan fill="#64d2ff">place-items</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#ff9f0a">center</tspan><tspan fill="#f5f5f7">;</tspan></text>
      <text x="100" y="460" fill="#6e6e73">4</text>
      <text x="170" y="460"><tspan fill="#64d2ff">color</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#bf5af2">var</tspan><tspan fill="#f5f5f7">(--blue);</tspan></text>
      <text x="100" y="495" fill="#6e6e73">5</text>
      <text x="140" y="495" fill="#f5f5f7">}</text>
      <text x="100" y="545" fill="#6e6e73">6</text>
      <text x="140" y="545"><tspan fill="#ff7ab2">.card:hover</tspan><tspan fill="#f5f5f7"> {</tspan></text>
      <text x="100" y="580" fill="#6e6e73">7</text>
      <text x="170" y="580"><tspan fill="#64d2ff">transform</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#30d158">scale</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff9f0a">1.05</tspan><tspan fill="#f5f5f7">);</tspan></text>
      <text x="100" y="615" fill="#6e6e73">8</text>
      <text x="140" y="615" fill="#f5f5f7">}</text>
    </g>
    <!-- blinking-style text cursor -->
    <rect x="160" y="597" width="3" height="24" fill="#2997ff"/>
  </g>

  </g>

  <!-- ============ RIGHT: STYLED WEBSITE ============ -->
  <g transform="translate(288 70) scale(0.85)">
  <g transform="rotate(5 1580 470)">
    <g filter="url(#shadow)">
      <rect x="1290" y="230" width="560" height="480" rx="22" fill="#fff"/>
    </g>
    <rect x="1290" y="230" width="560" height="48" rx="22" fill="#f5f5f7"/>
    <rect x="1290" y="256" width="560" height="22" fill="#f5f5f7"/>
    <circle cx="1320" cy="254" r="7" fill="#ff5f57"/>
    <circle cx="1344" cy="254" r="7" fill="#febc2e"/>
    <circle cx="1368" cy="254" r="7" fill="#28c840"/>
    <rect x="1440" y="244" width="260" height="20" rx="10" fill="#e5e5ea"/>
    <!-- hero banner of the mini site -->
    <rect x="1310" y="296" width="520" height="200" rx="16" fill="url(#siteHeader)"/>
    <rect x="1340" y="330" width="60" height="10" rx="5" fill="#fff" fill-opacity="0.7"/>
    <rect x="1410" y="330" width="60" height="10" rx="5" fill="#fff" fill-opacity="0.7"/>
    <rect x="1480" y="330" width="60" height="10" rx="5" fill="#fff" fill-opacity="0.7"/>
    <rect x="1340" y="375" width="300" height="30" rx="8" fill="#fff"/>
    <rect x="1340" y="418" width="220" height="14" rx="7" fill="#fff" fill-opacity="0.75"/>
    <rect x="1340" y="450" width="110" height="30" rx="15" fill="#fff"/>
    <!-- three cards -->
    <rect x="1310" y="516" width="160" height="170" rx="14" fill="#f5f5f7"/>
    <rect x="1310" y="516" width="160" height="96" rx="14" fill="url(#cardA)"/>
    <rect x="1310" y="596" width="160" height="16" fill="url(#cardA)"/>
    <rect x="1326" y="630" width="110" height="12" rx="6" fill="#d2d2d7"/>
    <rect x="1326" y="652" width="80" height="12" rx="6" fill="#e5e5ea"/>

    <rect x="1490" y="506" width="160" height="180" rx="14" fill="#fff" filter="url(#shadow)"/>
    <rect x="1490" y="506" width="160" height="104" rx="14" fill="url(#cardB)"/>
    <rect x="1490" y="594" width="160" height="16" fill="url(#cardB)"/>
    <rect x="1506" y="628" width="110" height="12" rx="6" fill="#d2d2d7"/>
    <rect x="1506" y="650" width="80" height="12" rx="6" fill="#e5e5ea"/>

    <rect x="1670" y="516" width="160" height="170" rx="14" fill="#f5f5f7"/>
    <rect x="1670" y="516" width="160" height="96" rx="14" fill="url(#cardC)"/>
    <rect x="1670" y="596" width="160" height="16" fill="url(#cardC)"/>
    <rect x="1686" y="630" width="110" height="12" rx="6" fill="#d2d2d7"/>
    <rect x="1686" y="652" width="80" height="12" rx="6" fill="#e5e5ea"/>

    <!-- mouse pointer hovering the lifted card -->
    <path d="M1610 640 l0 56 l14 -14 l11 24 l11 -5 l-11 -24 l21 -1 z" fill="#1d1d1f" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  </g>

  <!-- ============ FLOATING UI CHIPS (bottom) ============ -->
  <!-- color swatches -->
  <g filter="url(#shadow)">
    <rect x="300" y="830" width="250" height="76" rx="38" fill="#1d1d1f" fill-opacity="0.9"/>
  </g>
  <rect x="300" y="830" width="250" height="76" rx="38" fill="none" stroke="#fff" stroke-opacity="0.15"/>
  <circle cx="345" cy="868" r="18" fill="#0071e3"/>
  <circle cx="395" cy="868" r="18" fill="#bf5af2"/>
  <circle cx="445" cy="868" r="18" fill="#ff375f"/>
  <circle cx="495" cy="868" r="18" fill="#ff9f0a"/>

  <!-- "Aa" type chip -->
  <g filter="url(#shadow)">
    <rect x="610" y="880" width="120" height="96" rx="24" fill="#1d1d1f" fill-opacity="0.9"/>
  </g>
  <rect x="610" y="880" width="120" height="96" rx="24" fill="none" stroke="#fff" stroke-opacity="0.15"/>
  <text x="670" y="944" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#f5f5f7">Aa</text>

  <!-- toggle switch -->
  <g filter="url(#shadow)">
    <rect x="1190" y="880" width="120" height="66" rx="33" fill="#30d158"/>
  </g>
  <circle cx="1277" cy="913" r="27" fill="#fff"/>

  <!-- layout grid chip -->
  <g filter="url(#shadow)">
    <rect x="1370" y="820" width="110" height="110" rx="24" fill="#1d1d1f" fill-opacity="0.9"/>
  </g>
  <rect x="1370" y="820" width="110" height="110" rx="24" fill="none" stroke="#fff" stroke-opacity="0.15"/>
  <rect x="1393" y="843" width="28" height="28" rx="6" fill="#2997ff"/>
  <rect x="1429" y="843" width="28" height="28" rx="6" fill="#2997ff" fill-opacity="0.5"/>
  <rect x="1393" y="879" width="28" height="28" rx="6" fill="#2997ff" fill-opacity="0.5"/>
  <rect x="1429" y="879" width="28" height="28" rx="6" fill="#2997ff"/>

  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="760" cy="180" r="3" fill-opacity="0.7"/>
    <circle cx="1180" cy="140" r="2.5" fill-opacity="0.6"/>
    <circle cx="980" cy="110" r="2" fill-opacity="0.5"/>
    <circle cx="1100" cy="980" r="3" fill-opacity="0.5"/>
    <circle cx="860" cy="1010" r="2" fill-opacity="0.5"/>
    <path d="M1230 300 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill-opacity="0.75"/>
    <path d="M700 760 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z" fill-opacity="0.6"/>
  </g>
</svg>
